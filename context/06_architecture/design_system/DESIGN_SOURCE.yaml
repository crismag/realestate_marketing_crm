model_version: 23
design_source:
  name: CrisGen UI
  repository_url: https://github.com/crismag/development_design_systems
  package_subdirectory: crisgen-ui
  requested_ref: main
  resolved_commit: e1c1a4f1e98ecc4dec9ae4eb16fa646069e94278
  access_status: partially_inspected
  package: "@crisgen/ui"
  package_version: 1.1.0
  private: true
  installation_method: documented-checkout-or-npm-pack_not-executed
  target_project_framework: Django server-rendered templates, vanilla CSS, crisgen-light
  inspected_paths:
    - crisgen-ui/README.md
    - crisgen-ui/package.json
    - crisgen-ui/llms.txt
    - crisgen-ui/patterns/dashboard-shell/spec.json
    - crisgen-ui/patterns/dashboard-shell/README.md
    - crisgen-ui/patterns/data-table/spec.json
    - crisgen-ui/patterns/data-table/README.md
    - crisgen-ui/components/Timeline/README.md
  app_integration:
    theme: crisgen-light
    behaviors: static/crm/behaviors.js (drawer, modal, tabs only; no inline styles)
    secondary_reference: material-dashboard-pro in the same repository at the same commit; its CSS is not loaded
  unresolved:
    - dropdown, popover, tooltip, select listbox, accordion and collapse behaviours are not loaded
