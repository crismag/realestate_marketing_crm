{% extends "base.html" %}{% block title %}Change password{% endblock %}
{% block content %}
<div class="page-head"><h1 class="cg-typography" data-variant="h4">Change password</h1></div>
<div class="cg-card card-pad narrow">
<form method="post" class="stack-sm" novalidate>{% csrf_token %}{% include "partials/form_errors.html" %}
{% for field in form %}{% include "partials/field.html" %}{% endfor %}
<div class="form-actions"><button class="cg-button" data-variant="gradient" data-color="primary" data-size="md" data-shape="rounded" data-full-width="false" type="submit">Change password</button></div>
</form></div>
{% endblock %}
