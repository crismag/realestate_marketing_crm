{% extends "base.html" %}{% block title %}Reset password{% endblock %}
{% block auth_content %}
<div class="cg-card auth-card" data-shadow="lg">
  <div class="card-title"><h1 class="cg-typography" data-variant="h5" data-color="inherit">Reset your password</h1></div>
  <form method="post" class="card-pad stack-sm" novalidate>{% csrf_token %}{% include "partials/form_errors.html" %}
    {% for field in form %}{% include "partials/field.html" %}{% endfor %}
    <button class="cg-button" data-variant="gradient" data-color="primary" data-size="md" data-shape="rounded" data-full-width="true" type="submit">Email me a reset link</button>
    <p class="small muted"><a href="{% url 'accounts:login' %}">Back to sign in</a></p>
  </form>
</div>
{% endblock %}
